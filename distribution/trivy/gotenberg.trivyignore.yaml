# Trivy exceptions for the gotenberg image only (gotenberg/gotenberg:8.40.0-chromium in distribution/release.json).
# Policy (ADR 0071): what we build (the app image) is scanned strictly and has no exception file. A third-party
# image may carry dated, scoped exceptions for findings without a fix in a released upstream image: one entry per
# finding id, scoped to the component by `paths` or `purls`, with a `statement` and an `expired_at` at most 90 days
# out. An expired entry stops suppressing, so the release scan fails again until the entry is reviewed.
# release.yml scans this image with only this file (--ignorefile, --show-suppressed).
# 2 findings (zlib1g and libminizip1t64, both platforms), CVE-2026-76844 and CVE-2026-85091, all 8.38.1 entries removed (Chromium 156.0.8078.79, Go 1.27.x); 30 days (fixed upstream, waiting for a Gotenberg image release).

vulnerabilities:
  - id: CVE-2026-76844
    purls:
      - pkg:deb/debian/zlib1g
      - pkg:deb/debian/libminizip1t64
    expired_at: 2026-12-13
    statement: "gotenberg 8.40.0 has Debian 13.7's zlib 1:1.3.dfsg+really1.3.1-1+b1 (zlib1g and libminizip1t64); fixed in Debian trixie-security 1:1.3.dfsg+really1.3.1-1+deb13u1, which the image does not have yet. 8.40.0 (2026-11-05) is the last Gotenberg 8 release (its notes say the next release is Gotenberg 9) and the newest image of the 8 line; 9.x is a major version and is not taken in this refresh. 30 days (2026-11-13 to 2026-12-13, ADR 0071 and ADR 0093): fixed upstream, only the image release is missing. Reachability not analysed; Chromium renders only HTML the app generates, on the internal network."
  - id: CVE-2026-85091
    purls:
      - pkg:deb/debian/zlib1g
      - pkg:deb/debian/libminizip1t64
    expired_at: 2026-12-13
    statement: "gotenberg 8.40.0 has Debian 13.7's zlib 1:1.3.dfsg+really1.3.1-1+b1 (zlib1g and libminizip1t64); fixed in Debian trixie-security 1:1.3.dfsg+really1.3.1-1+deb13u1, which the image does not have yet. 8.40.0 (2026-11-05) is the last Gotenberg 8 release (its notes say the next release is Gotenberg 9) and the newest image of the 8 line; 9.x is a major version and is not taken in this refresh. 30 days (2026-11-13 to 2026-12-13, ADR 0071 and ADR 0093): fixed upstream, only the image release is missing. Reachability not analysed; Chromium renders only HTML the app generates, on the internal network."
