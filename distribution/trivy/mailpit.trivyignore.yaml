# Trivy exceptions for the mailpit image only (axllent/mailpit:v1.31.6 in distribution/release.json).
# Policy (ADR 0071): what we build (the app image) is scanned strictly and has no exception file. A third-party
# image may carry dated, scoped exceptions for findings without a fix in a released upstream image: one entry per
# finding id, scoped to the component by `paths` or `purls`, with a `statement` and an `expired_at` at most 90 days
# out. An expired entry stops suppressing, so the release scan fails again until the entry is reviewed.
# release.yml scans this image with only this file (--ignorefile, --show-suppressed).
# 1 high finding in the mailpit binary, CVE-2026-111943 (Go 1.27.2 stdlib, 2026-10-21); 30 days (fixed upstream, waiting for a Mailpit release).

vulnerabilities:
  - id: CVE-2026-111943
    paths:
      - mailpit
    expired_at: 2026-11-20
    statement: "Go 1.27.2 standard library in the mailpit binary of v1.31.6, the latest release (2026-10-15). Go crypto/x509 (CA distrust mitigation, published 2026-10-21) is fixed in Go 1.26.10 / 1.27.3 (fixed upstream, only the image release is missing: 30 days, ADR 0071). Waiting for a Mailpit release. Reachability not analysed; Mailpit is the local mail catcher, its UI only behind the operator session (ADR 0054)."
