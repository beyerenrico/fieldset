# Trivy exceptions for the postgres image only (postgres:16.15-alpine in distribution/release.json).
# Policy (ADR 0071): what we build (the app image) is scanned strictly and has no exception file. A third-party
# image may carry dated, scoped exceptions for findings without a fix in a released upstream image: one entry per
# finding id, scoped to the component by `paths` or `purls`, with a `statement` and an `expired_at` at most 90 days
# out. An expired entry stops suppressing, so the release scan fails again until the entry is reviewed.
# release.yml scans this image with only this file (--ignorefile, --show-suppressed).
# 25 findings (1 critical, 24 high), all in usr/local/bin/gosu; 90 days (not reachable, upstream policy).

vulnerabilities:
  - id: CVE-2025-61726
    paths:
      - usr/local/bin/gosu
    expired_at: 2027-01-16
    statement: "Go 1.24.6 standard library in gosu 1.19, the latest gosu release, which the official postgres image ships. Not reachable: govulncheck (2026-10-18) finds no call path from gosu, which only switches user and execs the entrypoint. gosu SECURITY.md and the docker-library FAQ treat such findings as false positives and do not rebuild for them."
