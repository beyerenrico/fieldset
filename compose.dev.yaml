# Local development overrides: publish service ports on non-default host ports and add Mailpit.
services:
  postgres:
    ports:
      - "${FORWARD_DB_PORT:-54329}:5432"
    # The parallel PHP suite drops hundreds of tables in one transaction per worker.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    # Test databases for the PHP suite and parallel agents (owned by `fieldset`): development only.
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
  redis:
    ports:
      - "${FORWARD_REDIS_PORT:-63799}:6379"
  gotenberg:
    networks: [renderer, default]
    ports:
      - "${FORWARD_GOTENBERG_PORT:-13000}:3000"
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-18025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-11025}:1025"
  # SSO (M7): Keycloak runs on the host-published http://keycloak.localhost:8180 (its issuer), which the
  # containers reach through the host gateway; insecure IdPs and config-backed DNS are dev/CI only.
  app:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SSO_ALLOW_INSECURE_IDP: "true"
      SSO_DNS_DRIVER: config
      SSO_DNS_RECORDS: '{"_fieldset-verification.sso-demo.test":["fieldset-verification=c0ffee0000000000000000000000000000550001"],"_fieldset-verification.saml-demo.test":["fieldset-verification=c0ffee0000000000000000000000000000550002"]}'
    extra_hosts:
      - "keycloak.localhost:host-gateway"
  # Mail is queued (M3), so the worker and scheduler need the in-network Mailpit too.
  queue:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SSO_ALLOW_INSECURE_IDP: "true"
      SSO_DNS_DRIVER: config
      SSO_DNS_RECORDS: '{"_fieldset-verification.sso-demo.test":["fieldset-verification=c0ffee0000000000000000000000000000550001"],"_fieldset-verification.saml-demo.test":["fieldset-verification=c0ffee0000000000000000000000000000550002"]}'
    extra_hosts:
      - "keycloak.localhost:host-gateway"
  scheduler:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SSO_ALLOW_INSECURE_IDP: "true"
      SSO_DNS_DRIVER: config
      SSO_DNS_RECORDS: '{"_fieldset-verification.sso-demo.test":["fieldset-verification=c0ffee0000000000000000000000000000550001"],"_fieldset-verification.saml-demo.test":["fieldset-verification=c0ffee0000000000000000000000000000550002"]}'
    extra_hosts:
      - "keycloak.localhost:host-gateway"
  # OIDC/SAML IdP for development and E2E (ADR 0036). Opt-in: COMPOSE_PROFILES=sso (set in the CI e2e job).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [sso]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin   # development only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin   # development only
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    # The image has no curl: ask the management port (9000) for /health/ready over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r line <&3 && [[ "$$line" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
