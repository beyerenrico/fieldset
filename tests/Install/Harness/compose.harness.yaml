# Local release harness (plan KTD23, U7; ADR 0064, ADR 0067). Started and stopped only by
# tests/Support/Docker/ReleaseHarness.php, which names the project fieldset-test-harness-<run id> and sets the
# FIELDSET_HARNESS_* variables. No real registry or account is involved: images are built and mirrored into this
# registry, and dist/ is served like GitHub Releases' download paths.
#
# Later units add their substitutes here (the fake tunnel), each behind a profile so a plain release run stays
# small: Pebble with challtestsrv is the `acme` profile (U8, J2), Traefik the `proxy` profile (U9, J3).
name: fieldset-test-harness

services:
  # CNCF Distribution. Partial indexes are accepted (validation platforms: none), so third-party images keep
  # their upstream index digest while only the platforms under test are copied. Relative upload URLs keep
  # pushes working through the forwarder below.
  registry:
    image: docker.io/library/registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    environment:
      REGISTRY_HTTP_RELATIVEURLS: "true"
      REGISTRY_VALIDATION_MANIFESTS_INDEXES_PLATFORMS: none
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_LOG_LEVEL: warn
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "127.0.0.1::5000"

  # Static release server for dist/ (download/v<version>/…, latest/download/… for stable releases only).
  release-server:
    image: docker.io/library/caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ${FIELDSET_HARNESS_DIST:?set by ReleaseHarness}:/srv:ro
    ports:
      - "127.0.0.1::8080"

  # Docker Desktop publishes ports only on the Mac side: the daemon (docker pull) and network=host containers
  # (the buildx builder, cosign) cannot reach 127.0.0.1:<port> inside the VM. This forwarder listens on the
  # same port in the VM's host network and proxies to the registry. ReleaseHarness starts it only when a
  # host-network probe fails; on Linux the published port already works there.
  registry-forwarder:
    profiles: [forwarder]
    image: docker.io/library/caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    network_mode: host
    command:
      - caddy
      - reverse-proxy
      - --from
      - ":${FIELDSET_HARNESS_REGISTRY_PORT:-5000}"
      - --to
      - "${FIELDSET_HARNESS_REGISTRY_TARGET:-127.0.0.1:5000}"

  # ACME for domain mode (plan U8, J2; ADR 0064, ADR 0075), started by tests/Support/Docker/AcmeHarness.php.
  # challtestsrv is Pebble's DNS and answers every A query with the edge's address on the acme network (the journey
  # connects the instance's edge there). Pebble validates HTTP-01 on port 80 of that address and serves ACME over
  # HTTPS with the static minica certificate of its image (test/certs/pebble.minica.pem), which the edge trusts
  # through acme_ca_root. Its issuing root is generated anew on every start: read it from the management API.
  challtestsrv:
    profiles: [acme]
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
    command:
      - -defaultIPv4
      - "${FIELDSET_HARNESS_EDGE_IP:-10.214.0.50}"
      - -defaultIPv6
      - ""
      - -dnsserver
      - ":8053"
      - -http01
      - ""
      - -https01
      - ""
      - -tlsalpn01
      - ""
      - -doh
      - ""
    networks:
      acme:
        ipv4_address: "${FIELDSET_HARNESS_DNS_IP:-10.214.0.10}"

  pebble:
    profiles: [acme]
    image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
    command: ["-config", "/harness/pebble-config.json", "-dnsserver", "${FIELDSET_HARNESS_DNS_IP:-10.214.0.10}:8053"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ./pebble-config.json:/harness/pebble-config.json:ro
    ports:
      - "127.0.0.1::15000"
    networks:
      acme:
        ipv4_address: "${FIELDSET_HARNESS_PEBBLE_IP:-10.214.0.11}"

  # Proxy mode's Traefik (J3, plan U9; version per ADR 0064): watches the engine for containers labelled
  # traefik.enable=true and reaches them over the external network FIELDSET_HARNESS_PROXY_NETWORK, which
  # ReleaseHarness::startProxy() creates. Nothing is published: journey clients sit on the same network. The
  # websecure entry point serves Traefik's default self-signed certificate.
  traefik:
    profiles: [proxy]
    image: docker.io/library/traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${FIELDSET_HARNESS_PROXY_NETWORK:-fieldset-test-proxy}
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  acme:
    ipam:
      config:
        - subnet: "${FIELDSET_HARNESS_ACME_SUBNET:-10.214.0.0/24}"
  proxy:
    external: true
    name: ${FIELDSET_HARNESS_PROXY_NETWORK:-fieldset-test-proxy}

volumes:
  registry-data:
